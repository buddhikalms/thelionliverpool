# nginx vhost - thelionliverpool.co.uk (static site)
# Place in /etc/nginx/sites-available/thelionliverpool.co.uk
# then: ln -s ../sites-available/thelionliverpool.co.uk /etc/nginx/sites-enabled/
#
# The `map` block must stay at the top of the file (http context), not inside server{}.

# Product slugs run to 61 characters, past nginx's default 64-byte hash
# bucket, so these must be raised before the map is declared.
map_hash_bucket_size 128;
map_hash_max_size 2048;

