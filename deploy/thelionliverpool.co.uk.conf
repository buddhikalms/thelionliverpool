server {
    listen 80;
    listen [::]:80;
    server_name thelionliverpool.co.uk www.thelionliverpool.co.uk;

    root /var/www/thelionliverpool-website;
    index index.html;

    access_log /var/log/nginx/thelionliverpool.access.log;
    error_log  /var/log/nginx/thelionliverpool.error.log;

    # --- canonical host: send apex to www ---------------------------------
    if ($host = thelionliverpool.co.uk) {
        return 301 $scheme://www.thelionliverpool.co.uk$request_uri;
    }

    # --- never serve repository or deployment files -----------------------
    # The site is deployed by git clone, so .git sits inside the web root.
    # Without this, /.git/config and the whole history are downloadable.
    # .well-known stays reachable - certbot needs it.
    location ^~ /deploy/            { deny all; return 404; }
    location ^~ /menu-data/         { deny all; return 404; }
    location ~ /\.git               { deny all; return 404; }
    location ~ /\.(?!well-known)    { deny all; return 404; }

    # --- ordering and booking live on a separate app ----------------------
    # These pages only ever linked outward, and /order-online/ additionally
    # opened a WooFood modal with no close button. Redirect instead of serving.
    # Prefix match (^~), not exact (=): an exact match only catches the bare
    # directory URI, letting /order-online/index.html fall through to try_files
    # and be served. ^~ covers the .html form and /order-online-2/ as well.
    location ^~ /order-online { return 301 https://online.thelionliverpool.co.uk/; }
    location ^~ /reservation  { return 301 https://online.thelionliverpool.co.uk/book; }

    # --- retired shop ------------------------------------------------------
    location ^~ /product/ { return 301 $lion_product_target; }

    location ^~ /product-category/drinks-menu    { return 301 /drinks-menu/; }
    location ^~ /product-category/lion-sushi     { return 301 /sushi-menu/; }
    location ^~ /product-category/japanese-menu  { return 301 /menu/; }
    location ^~ /product-category/sri-lankan-menu { return 301 /menu/; }
    location ^~ /product-category/                { return 301 /menu/; }

    location ^~ /cart      { return 301 /; }
    location ^~ /checkout  { return 301 https://online.thelionliverpool.co.uk/; }

    # --- pages removed during the static conversion ------------------------
    location = /menus/     { return 301 /menu/; }        # stale duplicate, old prices
    location = /aboutus/   { return 301 /about-us/; }    # placeholder duplicate
    location = /ourchefs/  { return 301 /about-us/; }    # unedited theme demo
    location = /contactus/ { return 301 /contact-us/; }  # duplicate never captured
    location = /newsletter/ { return 301 /; }

    # --- WordPress internals that should never have been indexed -----------
    location ^~ /elementor-hf/   { return 410; }
    location ^~ /metform-form/   { return 410; }
    location ^~ /elementor-120   { return 410; }
    location ^~ /wp-admin        { return 410; }
    location ^~ /wp-json         { return 410; }
    location ~  ^/(.*/)?feed/?$  { return 410; }
    location ~  ^/comments/      { return 410; }

    # --- static assets: long cache, they are content-hashed by the export ---
    location ~* \.(css|js|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|eot|otf|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }
    location = /llms.txt    { add_header Cache-Control "public, max-age=3600"; }

    # --- pages -------------------------------------------------------------
    # Clean URLs: /about-us/ -> /about-us/index.html
    location / {
        # Pages carry no content hash, so a browser that caches one keeps
        # serving it after a deploy. That shipped a stale contact form with
        # the placeholder access key still in it. "no-cache" does not mean
        # do not store, it means revalidate before reuse: with the ETag
        # above that is a 304 in the common case, not a re-download.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri/index.html =404;
    }

    # After DNS points here, run:  certbot --nginx -d thelionliverpool.co.uk -d www.thelionliverpool.co.uk
    # Certbot adds the 443 server block and the http->https redirect itself.

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;
}
